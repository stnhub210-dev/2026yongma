<!doctype html>
<html lang="ko" data-base="">
<head>
<meta charset="utf-8">
<!-- Google 애널리틱스(GA4) — 용마미식거리 홈페이지 방문 분석. 측정 ID G-W84140VW6Y (애널리틱스 계정 STN미디어) -->
<script async src="https://www.googletagmanager.com/gtag/js?id=G-W84140VW6Y"></script>
<script>
  window.dataLayer = window.dataLayer || [];
  function gtag(){dataLayer.push(arguments);}
  gtag('js', new Date());
  gtag('config', 'G-W84140VW6Y');
</script>
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>참여 신청 — 용마미식거리</title>
<meta name="description" content="한번봐존 프리마켓 셀러, 골목어게인 버스커, 체험 프로그램, 로컬창업 상담 신청을 받습니다.">
<link rel="icon" href="/favicon.ico" sizes="48x48">
<link rel="icon" href="/assets/icons/favicon-32.png" type="image/png" sizes="32x32">
<link rel="apple-touch-icon" href="/assets/icons/apple-touch-icon.png">
<link rel="manifest" href="/manifest.webmanifest">
<meta name="theme-color" content="#0E1F4D">
<link rel="stylesheet" href="assets/css/style.css?v=20261010zc">
</head>
<body>
<div id="site-header"></div>

<main>

<section class="page-hero" style="background-image:linear-gradient(180deg,rgba(12,10,9,.70),rgba(12,10,9,.82)),url('assets/img/gallery/20260919_180757.webp')">
  <div class="wrap">
    <span class="eyebrow">Join</span>
    <h1>용마거리에서 함께하실래요?</h1>
    <p class="lead mt-2" style="max-width:60ch">
      프리마켓 셀러, 버스킹 참가자, 체험 프로그램, 창업 상담까지.
      아래에서 유형을 고르고 신청해 주시면 담당자가 확인 후 연락드립니다.
    </p>
  </div>
</section>

<section class="section">
  <div class="wrap" style="max-width:1120px">

    <div class="join-split">

    <div class="join-types">
      <button class="tile reveal type-btn" data-type="seller" id="seller" style="text-align:left;cursor:pointer;border:1.5px solid var(--line)">
        <span class="type-thumb"><img src="assets/img/prog-market.webp" alt="" loading="lazy"></span>
        <h3>프리마켓 셀러</h3><p class="muted tiny mt-1">한번봐존 · 행사기간 상시</p>
      </button>
      <button class="tile reveal type-btn" data-type="busker" id="busker" style="text-align:left;cursor:pointer;border:1.5px solid var(--line)">
        <span class="type-thumb"><img src="assets/img/prog-stage.webp" alt="" loading="lazy"></span>
        <h3>버스커</h3><p class="muted tiny mt-1">골목어게인 · 총 15회 (매주 금·토요일)</p>
      </button>
      <button class="tile reveal type-btn" data-type="experience" style="text-align:left;cursor:pointer;border:1.5px solid var(--line)">
        <span class="type-thumb"><img src="assets/img/prog-experience.webp" alt="" loading="lazy"></span>
        <h3>체험 프로그램</h3><p class="muted tiny mt-1">놀아존 · 향토음식·공예</p>
      </button>
      <button class="tile reveal type-btn" data-type="startup" id="startup" style="text-align:left;cursor:pointer;border:1.5px solid var(--line)">
        <span class="type-thumb"><img src="assets/img/prog-startup.webp" alt="" loading="lazy"></span>
        <h3>로컬창업 상담</h3><p class="muted tiny mt-1">창업 멘토링·핵점포 연계</p>
      </button>
    </div>

    <div class="panel" id="join-form" style="border-radius:var(--radius-lg)">
      <!-- 신청서 머리 — 유형별 사진 위에 검정 반투명을 덮고 흰 글씨로 제목·설명을 올린다.
           사진과 글은 카드를 누를 때 select() 가 바꾼다. -->
      <figure class="form-hero">
        <img id="form-hero-img" src="assets/img/prog-market.webp" alt="">
        <figcaption>
          <h3 id="form-title">프리마켓 셀러 신청</h3>
          <p id="form-desc">강릉 로컬 수공예·커피·디저트 등 셀러를 모집합니다. 참가비는 없으며 매대·천막은 주최 측이 준비합니다.</p>
        </figcaption>
      </figure>

      <div id="msg" class="alert"></div>

      <form id="apply-form" novalidate>
        <input type="hidden" id="f-type" value="seller">

        <div class="grid grid-2" style="gap:0 20px">
          <div class="field">
            <label for="f-name">신청자명 / 팀명</label>
            <input class="input" id="f-name" required placeholder="예) 강릉공방 김○○">
          </div>
          <div class="field">
            <label for="f-phone">연락처</label>
            <input class="input" id="f-phone" type="tel" required placeholder="010-0000-0000">
          </div>
          <div class="field">
            <label for="f-email">이메일</label>
            <input class="input" id="f-email" type="email" required placeholder="you@example.com">
          </div>
          <div class="field">
            <label for="f-date">희망 참여일 <span class="muted" style="font-weight:500">(선택)</span></label>
            <!-- 운영일(매주 금·토)만 고를 수 있다. 목록은 assets/js/events.js 가 채운다. -->
            <select class="input" id="f-date">
              <option value="">운영일 중에서 선택해 주십시오</option>
            </select>
          </div>
        </div>

        <div class="field">
          <label for="f-title" id="f-title-label">판매 품목</label>
          <input class="input" id="f-title" required placeholder="예) 도자기 컵·화병">
        </div>

        <div class="field">
          <label for="f-body" id="f-body-label">소개 및 요청사항</label>
          <textarea class="textarea" id="f-body" placeholder="활동 이력, 필요한 공간·전기 사용 여부 등을 자유롭게 적어 주십시오."></textarea>
        </div>

        <div class="field">
          <label for="f-link">참고 링크 <span class="muted" style="font-weight:500">(선택)</span></label>
          <input class="input" id="f-link" type="url" placeholder="인스타그램·유튜브·포트폴리오 주소">
        </div>

        <div class="field">
          <label class="checkbox"><input type="checkbox" id="f-agree" required>
            <span>[필수] 신청 접수 및 안내를 위한 개인정보 수집·이용에 동의합니다. (이름·연락처·이메일 / 사업 종료 후 1년 보관)</span></label>
        </div>

        <!-- 자동 등록기 차단용 빈칸 (사람에게는 보이지 않음) -->
        <input type="text" id="f-website" name="website" tabindex="-1" autocomplete="off" aria-hidden="true" style="position:absolute;left:-9999px;width:1px;height:1px">

        <button class="btn btn--primary btn--block" type="submit">신청서 제출</button>
        <p class="hint center mt-2">접수된 신청서는 담당자가 확인한 뒤 적어 주신 연락처로 안내드립니다.</p>
      </form>
    </div>

    </div><!-- /.join-split -->

  </div>
</section>

</main>
<div id="site-footer"></div>

<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<script src="assets/js/config.js?v=20261006f"></script>
<script src="assets/js/layout.js?v=20261006f"></script>
<script src="assets/js/i18n.js?v=20261006f"></script>
<script src="assets/js/auth.js?v=20261006f"></script>
<script src="assets/js/main.js?v=20261010"></script>
<!-- 운영일 목록(희망 참여일 선택지) — 홈 화면 달력과 같은 파일을 쓴다 -->
<script src="assets/js/events.js?v=20261009b"></script>
<script>
(() => {
  const TYPES = {
    seller:     { t: "프리마켓 셀러 신청", d: "강릉 로컬 수공예·커피·디저트 등 셀러를 모집합니다. 참가비는 없으며 매대·천막은 주최 측이 준비합니다.", tl: "판매 품목", tp: "예) 도자기 컵·화병", img: "assets/img/prog-market.webp" },
    busker:     { t: "버스커 참가 신청",   d: "인디밴드·어쿠스틱·보컬·댄스·국악 크로스오버 등 장르 제한 없이 모집합니다. 음향·무대는 주최 측이 제공합니다.", tl: "공연 장르·구성", tp: "예) 어쿠스틱 듀오 (기타+보컬)", img: "assets/img/prog-busker.webp" },
    experience: { t: "체험 프로그램 신청", d: "놀아존에서 진행할 향토음식·공예·캘리그라피 등 체험 운영자를 모집합니다.", tl: "체험 종목", tp: "예) 캘리그라피 엽서 만들기", img: "assets/img/prog-experience.webp" },
    startup:    { t: "로컬창업 상담 신청", d: "창업 멘토링과 핵점포 연계 인큐베이팅을 안내합니다.", tl: "희망 업종", tp: "예) 로스터리 카페", img: "assets/img/prog-startup.webp" },
  };

  const msg = document.getElementById("msg");
  const form = document.getElementById("apply-form");
  const btns = document.querySelectorAll(".type-btn");

  /* 희망 참여일 — 홈 화면 달력과 같은 운영일(매주 금·토)만 고를 수 있게 채운다.
     날짜 데이터는 assets/js/events.js 한 곳에만 있어 달력과 어긋날 일이 없다. */
  (() => {
    const sel = document.getElementById("f-date");
    const days = window.YM_EVENT_DAYS || [];
    if (!sel || !days.length) return;
    const byMonth = new Map();
    days.forEach((d) => {
      const m = Number(d.date.slice(5, 7));
      if (!byMonth.has(m)) byMonth.set(m, []);
      byMonth.get(m).push(d);
    });
    byMonth.forEach((list, m) => {
      const g = document.createElement("optgroup");
      g.label = m + "월";
      list.forEach((d) => {
        const o = document.createElement("option");
        o.value = d.date;
        o.textContent = d.label;          // 예) 10월 16일(금) · 정규행사
        g.appendChild(o);
      });
      sel.appendChild(g);
    });
  })();

  function select(type) {
    const c = TYPES[type]; if (!c) return;
    document.getElementById("f-type").value = type;
    document.getElementById("form-title").textContent = c.t;
    document.getElementById("form-desc").textContent = c.d;
    document.getElementById("form-hero-img").src = c.img;
    document.getElementById("f-title-label").textContent = c.tl;
    document.getElementById("f-title").placeholder = c.tp;
    btns.forEach((b) => {
      const on = b.dataset.type === type;
      b.style.borderColor = on ? "var(--amber-500)" : "var(--line)";
      b.style.background = on ? "var(--amber-50)" : "#fff";
    });
    UI.clearAlert(msg);
  }
  btns.forEach((b) => b.addEventListener("click", () => {
    select(b.dataset.type);
    /* 넓은 화면에서는 신청서가 바로 옆에 있어 그대로 보인다.
       좁은 화면에서는 카드 아래로 밀려나 눌러도 안 보이므로 그때만 신청서로 내려 준다. */
    if (window.matchMedia("(max-width: 900px)").matches) {
      document.getElementById("join-form").scrollIntoView({ behavior: "smooth", block: "start" });
    }
  }));
  select(location.hash.replace("#", "") in TYPES ? location.hash.replace("#", "") : "seller");

  /* 신청서는 STN 포털이 받아 저장한다 (홈페이지는 정적 사이트라 서버가 없음) */
  const APPLY_URL = "https://stn6000.com/yongma/api/apply";

  form.addEventListener("submit", async (e) => {
    e.preventDefault();
    UI.clearAlert(msg);
    if (!document.getElementById("f-agree").checked) {
      return UI.alert(msg, "err", "개인정보 수집·이용 동의가 필요합니다.");
    }
    const btn = form.querySelector("button[type=submit]");
    btn.disabled = true;
    const payload = {
      type: document.getElementById("f-type").value,
      applicant_name: document.getElementById("f-name").value.trim(),
      phone: document.getElementById("f-phone").value.trim(),
      email: document.getElementById("f-email").value.trim(),
      preferred_date: document.getElementById("f-date").value || null,
      title: document.getElementById("f-title").value.trim(),
      body: document.getElementById("f-body").value.trim(),
      link: document.getElementById("f-link").value.trim() || null,
    };
    try {
      const res = await fetch(APPLY_URL, {
        method: "POST",
        headers: { "Content-Type": "application/json" },
        body: JSON.stringify({
          ...payload,
          website: document.getElementById("f-website").value,   // 자동 등록기 차단용 빈칸
          agree: true,
        }),
      });
      const j = await res.json().catch(() => ({}));
      if (!res.ok || !j.ok) throw new Error(j.error || "서버 응답 오류 (" + res.status + ")");

      /* 포털에 저장되고 알림 메일이 나간 뒤, 홈페이지 관리자 화면이 읽는 Supabase 에도 같은 내용을 넣는다.
         여기서 실패해도 접수 자체는 이미 끝났으므로 손님 화면에는 영향을 주지 않는다. */
      try {
        const c = Auth.client();
        if (c) {
          const u = await Auth.user().catch(() => null);
          await c.from("applications").insert({ ...payload, user_id: u ? u.id : null });
        }
      } catch (e) {
        console.warn("관리자 화면용 저장 실패(접수는 정상):", e);
      }

      form.reset();
      select(document.getElementById("f-type").value);
      UI.alert(msg, "ok", "신청이 접수되었습니다. 담당자가 확인 후 연락드리겠습니다.");
      window.scrollTo({ top: form.offsetTop - 140, behavior: "smooth" });
    } catch (err) {
      UI.alert(msg, "err", "접수 중 오류가 발생했습니다: " + err.message);
    } finally {
      btn.disabled = false;
    }
  });
})();
</script>
</body>
</html>
