<!doctype html>
<html lang="ko" data-base="">
<head>

<meta name="viewport" content="width=device-width, initial-scale=1">
<title>마이페이지 — 용마미식거리</title>
<meta name="robots" content="noindex">
<link rel="icon" href="/favicon.ico" sizes="48x48">
<link rel="icon" href="/assets/icons/favicon-32.png" type="image/png" sizes="32x32">
<link rel="apple-touch-icon" href="/assets/icons/apple-touch-icon.png">
<link rel="manifest" href="/manifest.webmanifest">
<meta name="theme-color" content="#0E1F4D">
<link rel="stylesheet" href="assets/css/style.css?v=20261010zn">
</head>
<body>
<div id="site-header"></div>

<main class="section">
  <div class="wrap" style="max-width:900px">
    <div class="sec-head">
      <span class="eyebrow">My Page</span>
      <h1 id="hello">마이페이지</h1>
      <p class="muted mt-1" id="sub">신청 내역과 회원 정보를 확인하실 수 있습니다.</p>
    </div>

    <div id="msg" class="alert"></div>

    <!-- 회원 정보 -->
    <div class="panel">
      <h3>회원 정보</h3>
      <p class="panel-sub">이름과 연락처는 수정하실 수 있습니다.</p>
      <form id="profile-form">
        <div class="grid grid-2" style="gap:0 20px">
          <div class="field"><label for="p-name">이름</label><input class="input" id="p-name" required></div>
          <div class="field"><label for="p-phone">연락처</label><input class="input" id="p-phone" type="tel" placeholder="010-0000-0000"></div>
        </div>
        <div class="field"><label for="p-email">이메일</label><input class="input" id="p-email" disabled></div>
        <div class="field">
          <label class="checkbox"><input type="checkbox" id="p-mkt"><span>행사 소식을 이메일로 받겠습니다.</span></label>
        </div>
        <button class="btn btn--primary" type="submit">저장</button>
      </form>
    </div>

    <!-- 신청 내역 -->
    <div class="panel">
      <h3>내 신청 내역</h3>
      <p class="panel-sub">담당자가 확인하면 상태가 바뀝니다.</p>
      <div id="apps-state" class="alert alert--info show">불러오는 중…</div>
      <div class="table-scroll hidden" id="apps-wrap">
        <table class="data">
          <thead><tr><th>신청일</th><th>유형</th><th>내용</th><th>희망일</th><th>상태</th></tr></thead>
          <tbody id="apps-body"></tbody>
        </table>
      </div>
      <a class="btn btn--ghost btn--sm mt-3" href="join.html">새 신청하기</a>
    </div>
  </div>
</main>

<div id="site-footer"></div>

<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<script src="assets/js/config.js?v=20261006f"></script>
<script src="assets/js/layout.js?v=20261006f"></script>
<script src="assets/js/i18n.js?v=20261006f"></script>
<script src="assets/js/auth.js?v=20261006f"></script>
<script src="assets/js/main.js?v=20261010"></script>
<script>
(async () => {
  const msg = document.getElementById("msg");
  if (!Auth.ready()) {
    UI.alert(msg, "warn", "회원 시스템이 아직 연결되지 않았습니다. Supabase 설정을 완료해 주십시오.");
    return;
  }
  const user = await Auth.requireAuth("login.html");
  if (!user) return;
  const c = Auth.client();

  /* ----- 프로필 ----- */
  const prof = await Auth.profile();
  document.getElementById("hello").textContent = (prof?.name || "회원") + "님, 반갑습니다";
  document.getElementById("p-name").value = prof?.name || user.user_metadata?.name || "";
  document.getElementById("p-phone").value = prof?.phone || user.user_metadata?.phone || "";
  document.getElementById("p-email").value = user.email;
  document.getElementById("p-mkt").checked = !!prof?.marketing_opt_in;

  document.getElementById("profile-form").addEventListener("submit", async (e) => {
    e.preventDefault();
    UI.clearAlert(msg);
    const { error } = await c.from("profiles").upsert({
      id: user.id,
      name: document.getElementById("p-name").value.trim(),
      phone: document.getElementById("p-phone").value.trim(),
      marketing_opt_in: document.getElementById("p-mkt").checked,
    });
    UI.alert(msg, error ? "err" : "ok", error ? "저장 실패: " + error.message : "저장했습니다.");
  });

  /* ----- 신청 내역 ----- */
  const TYPE = { seller: "프리마켓 셀러", busker: "버스커", experience: "체험 프로그램", startup: "로컬창업 상담" };
  const ST = { received: ["접수", "chip"], reviewing: ["검토중", "chip--blue"],
               accepted: ["선정", "chip--green"], rejected: ["미선정", "chip--red"], done: ["완료", "chip--amber"] };

  const state = document.getElementById("apps-state");
  const { data, error } = await c.from("applications").select("*")
    .eq("user_id", user.id).order("created_at", { ascending: false });

  if (error) { UI.alert(state, "err", "불러오지 못했습니다: " + error.message); return; }
  if (!data || !data.length) { UI.alert(state, "info", "아직 신청 내역이 없습니다."); return; }

  state.className = "alert";
  document.getElementById("apps-wrap").classList.remove("hidden");
  document.getElementById("apps-body").innerHTML = data.map((a) => {
    const [label, cls] = ST[a.status] || ST.received;
    return `<tr>
      <td>${UI.date(a.created_at)}</td>
      <td>${TYPE[a.type] || a.type}</td>
      <td>${a.title || "-"}</td>
      <td>${a.preferred_date ? UI.date(a.preferred_date) : "-"}</td>
      <td><span class="chip ${cls}">${label}</span></td></tr>`;
  }).join("");
})();
</script>
</body>
</html>
