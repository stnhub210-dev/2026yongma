<!doctype html>
<html lang="ko" data-base="">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>소식 — 용마미식거리</title>
<meta name="description" content="용마미식거리를 다룬 기사·블로그 글을 실시간으로 모아 보여 드리고, 공지사항을 전합니다.">
<style>
  .web-item { display: grid; grid-template-columns: 200px 1fr; gap: 18px; align-items: center; padding: 18px 4px; border-bottom: 1px solid var(--line); }
  .web-item > div { display: grid; gap: 6px; min-width: 0; }
  .web-thumb { aspect-ratio: 16 / 9; border-radius: 12px; overflow: hidden; background: var(--amber-50); }
  .web-thumb img { width: 100%; height: 100%; object-fit: cover; transition: transform .4s var(--ease); }
  .web-item:hover .web-thumb img { transform: scale(1.04); }
  @media (max-width: 640px) { .web-item { grid-template-columns: 112px 1fr; gap: 12px; } .web-item h3 { font-size: .9375rem; } .web-item .muted { display: none; } }
  .web-item:hover h3 { color: var(--amber-700); }
  .web-item h3 { font-size: 1.0625rem; transition: color .16s; }
  .web-item h3::after { content: " ↗"; color: var(--ink-400); font-weight: 600; }
  .web-meta { display: flex; flex-wrap: wrap; gap: 8px; align-items: center; font-size: .8125rem; color: var(--ink-500); }
  .web-more { display: block; margin: 20px auto 0; }
</style>
<link rel="icon" href="assets/img/mascot-yong.webp">
<link rel="stylesheet" href="assets/css/style.css?v=20261006c">
</head>
<body>
<div id="site-header"></div>

<main>

<section class="page-hero" style="background-image:linear-gradient(180deg,rgba(12,10,9,.70),rgba(12,10,9,.82)),url('assets/img/gallery/20260918_185855.webp')">
  <div class="wrap">
    <span class="eyebrow">News</span>
    <h1>소식</h1>
    <p class="lead mt-2">용마미식거리를 다룬 기사와 블로그 글을 모아 보여 드립니다. 제목을 누르면 원문으로 이동합니다.</p>
    <dl class="hero-stats" id="web-stats" style="margin-top:36px">
      <div><dt>모은 소식</dt><dd><b data-live="total">0</b><span>건</span></dd></div>
      <div><dt>기사</dt><dd><b data-live="news">0</b><span>건</span></dd></div>
      <div><dt>블로그</dt><dd><b data-live="blog">0</b><span>건</span></dd></div>
      <div><dt>다룬 곳</dt><dd><b data-live="outlets">0</b><span>곳</span></dd></div>
    </dl>
  </div>
</section>

<!-- 웹 소식 — STN 포털이 30분마다 기사·블로그를 모아 준다 (/yongma/api/news) -->
<section class="section" id="web">
  <div class="wrap" style="max-width:900px">
    <div class="sec-head" style="margin-bottom:20px">
      <span class="eyebrow">On the Web</span>
      <h2>웹에 올라온 소식</h2>
      <p id="web-updated">기사·블로그를 불러오는 중입니다…</p>
    </div>
    <div class="chip-row" id="web-filter" style="margin-bottom:10px">
      <button class="chip chip--amber" data-kind="">전체</button>
      <button class="chip" data-kind="news">기사</button>
      <button class="chip" data-kind="blog">블로그</button>
    </div>
    <div id="web-state" class="alert alert--info show">불러오는 중입니다…</div>
    <div id="web-list"></div>
    <button class="btn btn--ghost btn--sm web-more hidden" id="web-more">더 보기</button>
  </div>
</section>

<section class="section section--soft" id="notice">
  <div class="wrap" style="max-width:900px">
    <div class="sec-head" style="margin-bottom:20px">
      <span class="eyebrow">Notice</span>
      <h2>공지사항</h2>
    </div>
    <div class="chip-row" id="news-filter" style="margin-bottom:26px">
      <button class="chip chip--amber" data-cat="">전체</button>
      <button class="chip" data-cat="notice">공지</button>
      <button class="chip" data-cat="event">행사</button>
      <button class="chip" data-cat="recruit">모집</button>
      <button class="chip" data-cat="press">보도</button>
    </div>

    <div id="news-state" class="alert alert--info show">소식을 불러오는 중입니다…</div>
    <div id="news-list" class="stack" style="gap:0"></div>

    <!-- 상세 -->
    <article id="news-detail" class="panel hidden" style="border-radius:var(--radius-lg)">
      <button class="btn btn--ghost btn--sm" id="back-list" style="margin-bottom:18px">← 목록으로</button>
      <div id="detail-body"></div>
    </article>
  </div>
</section>

</main>
<div id="site-footer"></div>

<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<script src="assets/js/config.js?v=20261006c"></script>
<script src="assets/js/layout.js?v=20261006c"></script>
<script src="assets/js/i18n.js?v=20261006c"></script>
<script src="assets/js/auth.js?v=20261006c"></script>
<script src="assets/js/main.js?v=20261006c"></script>
<script>
/* 웹 소식 — 기사·블로그 실시간 모음 */
(async () => {
  const API = "https://stn6000.com/yongma/api/news";
  const box = document.getElementById("web-list"), state = document.getElementById("web-state");
  const more = document.getElementById("web-more"), filter = document.getElementById("web-filter");
  const esc = (s) => String(s ?? "").replace(/[&<>"']/g, (m) => ({ "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;", "'": "&#39;" }[m]));
  const safe = (u) => /^https?:\/\//.test(u || "") ? u : "#";
  let items = [], kind = "", shown = 15;
  /* 대표사진 — 포털이 받아 둔 저장본을 쓴다(언론사가 외부 표시를 막아도 보이게).
     사진이 없거나 못 불러오면 용마미식거리 현장 사진을 번갈아 넣는다. */
  const IMG_API = "https://stn6000.com/yongma/api/news/img?u=";
  const FIELD = ["20260918_201800", "20260918_185900", "20260918_185855", "20260918_112248",
                 "20260918_174812", "20260919_180757"].map((id) => `assets/img/gallery/${id}_t.webp`);
  const fieldFor = (i) => FIELD[i % FIELD.length];

  function render() {
    const rows = kind ? items.filter((x) => (kind === "blog") === (x.kind === "blog")) : items;
    if (!rows.length) { UI.alert(state, "info", kind === "blog" ? "아직 모은 블로그 글이 없습니다." : "모은 소식이 없습니다."); box.innerHTML = ""; more.classList.add("hidden"); return; }
    state.className = "alert";
    box.innerHTML = rows.slice(0, shown).map((x, i) => `
      <a class="web-item" href="${esc(safe(x.link))}" target="_blank" rel="noopener noreferrer">
        <span class="web-thumb"><img src="${esc(safe(x.image) === "#" ? fieldFor(i) : IMG_API + encodeURIComponent(x.image))}" alt="" loading="lazy" onerror="this.onerror=null;this.src='${fieldFor(i)}'"></span>
        <div>
        <div class="web-meta">
          <span class="chip ${x.kind === "blog" ? "chip--green" : "chip--blue"}">${x.kind === "blog" ? "블로그" : "기사"}</span>
          <b style="color:var(--ink-700)">${esc(x.source)}</b><span>${esc((x.date || "").slice(0, 10).replace(/-/g, ". "))}</span>
        </div>
        <h3>${esc(x.title)}</h3>
        ${x.summary ? `<p class="muted tiny">${esc(x.summary)}</p>` : ""}
        </div>
      </a>`).join("");
    more.classList.toggle("hidden", rows.length <= shown);
  }
  filter.addEventListener("click", (e) => {
    const b = e.target.closest("button[data-kind]"); if (!b) return;
    filter.querySelectorAll("button").forEach((x) => x.classList.toggle("chip--amber", x === b));
    kind = b.dataset.kind; shown = 15; render();
  });
  more.onclick = () => { shown += 15; render(); };

  /* 숫자 카운트업 — 홈 화면 숫자와 같은 움직임(1.1초, 끝에서 천천히). 이전 값에서 새 값까지 올라간다 */
  const fmt = (n) => n.toLocaleString("ko-KR");
  function countTo(el, end) {
    const start = parseInt(el.dataset.now || "0", 10);
    el.dataset.now = end;
    if (start === end) { el.textContent = fmt(end); return; }
    const t0 = performance.now(), dur = 1100;
    const step = (t) => {
      const p = Math.min((t - t0) / dur, 1);
      el.textContent = fmt(Math.round(start + (end - start) * (1 - Math.pow(1 - p, 3))));
      if (p < 1) requestAnimationFrame(step);
    };
    requestAnimationFrame(step);
  }
  const KEY = "yongma-news-counts";       // 지난번에 본 숫자 (이 브라우저에만 저장)
  let seen = {};
  try { seen = JSON.parse(localStorage.getItem(KEY) || "{}"); } catch (e) {}
  document.querySelectorAll("[data-live]").forEach((el) => {
    const v = seen[el.dataset.live] || 0; el.dataset.now = v; el.textContent = fmt(v);
  });
  function paintStats() {
    const c = { total: items.length, news: items.filter((x) => x.kind !== "blog").length,
                blog: items.filter((x) => x.kind === "blog").length,
                outlets: new Set(items.map((x) => x.source)).size };
    document.querySelectorAll("[data-live]").forEach((el) => countTo(el, c[el.dataset.live] || 0));
    try { localStorage.setItem(KEY, JSON.stringify(c)); } catch (e) {}
  }

  async function load() {
    const j = await (await fetch(API, { cache: "no-store" })).json();
    items = j.items || [];
    paintStats();
    document.getElementById("web-updated").textContent =
      `${(j.sources || []).join(" · ") || "웹"}에서 ‘용마미식거리’ 관련 글을 모았습니다` + (j.updated ? ` · ${j.updated} 기준, 30분마다 갱신` : "");
    render();
  }
  try {
    await load();
  } catch (err) {
    UI.alert(state, "warn", "지금은 웹 소식을 불러오지 못했습니다. 잠시 뒤 다시 확인해 주십시오.");
    document.getElementById("web-updated").textContent = "";
  }
  setInterval(() => load().catch(() => {}), 10 * 60 * 1000);   // 열어 둔 동안 10분마다 새로 확인
})();

/* 공지사항 — Supabase posts */
(async () => {
  const list = document.getElementById("news-list");
  const state = document.getElementById("news-state");
  const filter = document.getElementById("news-filter");
  const detail = document.getElementById("news-detail");
  const detailBody = document.getElementById("detail-body");
  const CAT = { notice: ["공지", "chip--blue"], event: ["행사", "chip--amber"], recruit: ["모집", "chip--green"], press: ["보도", "chip"] };
  let rows = [];

  const esc = (s) => String(s ?? "").replace(/[&<>"']/g, (m) =>
    ({ "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;", "'": "&#39;" }[m]));

  function render(cat) {
    const items = cat ? rows.filter((r) => r.category === cat) : rows;
    if (!items.length) { UI.alert(state, "info", "등록된 공지가 없습니다."); list.innerHTML = ""; return; }
    state.className = "alert";
    list.innerHTML = items.map((p) => {
      const [label, cls] = CAT[p.category] || CAT.notice;
      return `<a href="#post-${p.id}" data-id="${p.id}" style="display:block;padding:22px 4px;border-bottom:1px solid var(--line)">
        <div style="display:flex;flex-wrap:wrap;gap:10px;align-items:center;margin-bottom:6px">
          <span class="chip ${cls}">${label}</span>
          ${p.pinned ? '<span class="chip chip--red">중요</span>' : ""}
          <span class="tiny muted">${UI.date(p.published_at || p.created_at)}</span>
        </div>
        <h3 style="font-size:1.125rem">${esc(p.title)}</h3>
        ${p.summary ? `<p class="muted mt-1">${esc(p.summary)}</p>` : ""}
      </a>`;
    }).join("");
  }

  function openDetail(id) {
    const p = rows.find((r) => String(r.id) === String(id));
    if (!p) return;
    const [label, cls] = CAT[p.category] || CAT.notice;
    detailBody.innerHTML = `
      <div class="chip-row" style="margin-bottom:12px"><span class="chip ${cls}">${label}</span>
      <span class="chip">${UI.date(p.published_at || p.created_at)}</span></div>
      <h2>${esc(p.title)}</h2>
      ${p.cover_url ? `<img src="${esc(p.cover_url)}" alt="" style="border-radius:var(--radius);margin:20px 0" loading="lazy">` : ""}
      <div class="mt-3" style="white-space:pre-wrap;line-height:1.8">${esc(p.body)}</div>`;
    list.classList.add("hidden"); filter.classList.add("hidden"); state.classList.add("hidden");
    detail.classList.remove("hidden");
    window.scrollTo({ top: 0, behavior: "smooth" });
  }

  document.getElementById("back-list").onclick = () => {
    detail.classList.add("hidden");
    list.classList.remove("hidden"); filter.classList.remove("hidden");
    history.replaceState(null, "", location.pathname);
  };

  list.addEventListener("click", (e) => {
    const a = e.target.closest("a[data-id]");
    if (!a) return;
    e.preventDefault();
    openDetail(a.dataset.id);
  });

  filter.addEventListener("click", (e) => {
    const b = e.target.closest("button[data-cat]"); if (!b) return;
    filter.querySelectorAll("button").forEach((x) => x.classList.remove("chip--amber"));
    b.classList.add("chip--amber");
    render(b.dataset.cat);
  });

  const c = Auth.client();
  if (!c) { UI.alert(state, "warn", "소식 데이터베이스가 아직 연결되지 않았습니다. Supabase 설정 후 관리자 페이지에서 글을 올리면 이곳에 표시됩니다."); return; }

  const { data, error } = await c.from("posts").select("*").eq("published", true)
    .order("pinned", { ascending: false }).order("published_at", { ascending: false });
  if (error) { UI.alert(state, "err", "소식을 불러오지 못했습니다: " + error.message); return; }
  rows = data || [];
  render("");
  if (location.hash.startsWith("#post-")) openDetail(location.hash.replace("#post-", ""));
})();
</script>
</body>
</html>
