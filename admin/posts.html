<!doctype html>
<html lang="ko" data-base="../">
<head>
<meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1">
<title>공지·소식 — 용마미식거리 관리자</title><meta name="robots" content="noindex">
<link rel="icon" href="/favicon.ico" sizes="48x48">
<link rel="icon" href="/assets/icons/favicon-32.png" type="image/png" sizes="32x32">
<link rel="apple-touch-icon" href="/assets/icons/apple-touch-icon.png">
<link rel="manifest" href="/manifest.webmanifest">
<meta name="theme-color" content="#0E1F4D">
<link rel="stylesheet" href="../assets/css/style.css?v=20261010zd">
</head>
<body class="admin-body">
<div class="admin-shell">
  <div id="admin-side"></div>
  <main class="admin-main" id="admin-main">
    <div class="admin-head">
      <div><h1>공지·소식</h1><p class="muted tiny" id="admin-who"></p></div>
      <div class="btn-row">
        <a class="btn btn--ghost btn--sm" href="../news.html" target="_blank">공개 페이지 보기</a>
        <button class="btn btn--primary btn--sm" id="btn-add">글 작성</button>
      </div>
    </div>
    <div id="admin-msg" class="alert"></div>
    <div class="panel">
      <p class="panel-sub">‘공개’로 표시한 글만 홈페이지 소식 페이지에 노출됩니다. ‘중요’ 글은 목록 상단에 고정됩니다.</p>
      <div class="table-scroll">
        <table class="data">
          <thead><tr><th style="min-width:80px">분류</th><th style="min-width:260px">제목</th><th>발행일</th><th>상태</th><th></th></tr></thead>
          <tbody id="rows"></tbody>
        </table>
      </div>
    </div>
  </main>
</div>
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<script src="../assets/js/config.js?v=20261006f"></script>
<script src="../assets/js/auth.js?v=20261006f"></script>
<script src="../assets/js/main.js?v=20261010"></script>
<script src="../assets/js/admin.js?v=20261010b"></script>
<script>
(async () => {
  if (!(await Admin.boot("posts.html"))) return;
  const T = "posts";
  const CAT = { notice: "공지", event: "행사", recruit: "모집", press: "보도" };
  const F = [
    { k: "category", label: "분류", type: "select", options: Object.entries(CAT) },
    { k: "title", label: "제목", req: true },
    { k: "summary", label: "요약 (목록에 표시)" },
    { k: "body", label: "본문", type: "textarea", req: true },
    { k: "cover_url", label: "대표 이미지 주소 (선택)" },
    { k: "published_at", label: "발행일", type: "date" },
    { k: "pinned", label: "상단 고정(중요)", type: "checkbox" },
    { k: "published", label: "공개", type: "checkbox", def: true },
  ];
  let rows = [];

  const render = () => document.getElementById("rows").innerHTML = rows.map((r) => `
    <tr>
      <td><span class="chip">${CAT[r.category] || "공지"}</span></td>
      <td><b>${Admin.esc(r.title)}</b>${r.summary ? `<br><span class="tiny muted">${Admin.esc(r.summary)}</span>` : ""}</td>
      <td class="tiny">${UI.date(r.published_at || r.created_at)}</td>
      <td>${r.pinned ? '<span class="chip chip--red">중요</span> ' : ""}
          <span class="chip ${r.published ? "chip--green" : ""}">${r.published ? "공개" : "비공개"}</span></td>
      <td style="white-space:nowrap">
        <button class="btn btn--ghost btn--sm" data-edit="${r.id}">수정</button>
        <button class="btn btn--ghost btn--sm" data-del="${r.id}">삭제</button></td>
    </tr>`).join("") || '<tr><td colspan="5" class="center muted">등록된 글이 없습니다.</td></tr>';

  const reload = async () => {
    rows = await Admin.load(T, { order: ["created_at", false] });
    render();
  };

  document.getElementById("btn-add").onclick = () => Admin.modal({
    title: "글 작성", fields: F,
    values: { published: true, published_at: new Date().toISOString().slice(0, 10), category: "notice" },
    onSave: async (v) => { v.author_id = Admin.user.id; await Admin.save(T, v); await reload(); Admin.toast("ok", "등록했습니다."); },
  });

  document.getElementById("rows").addEventListener("click", async (e) => {
    const ed = e.target.closest("[data-edit]"), de = e.target.closest("[data-del]");
    if (ed) {
      const row = rows.find((r) => String(r.id) === ed.dataset.edit);
      Admin.modal({ title: "글 수정", fields: F, values: row,
        onSave: async (v) => { await Admin.save(T, v); await reload(); Admin.toast("ok", "저장했습니다."); } });
    }
    if (de && confirm("삭제하시겠습니까?")) {
      try { await Admin.remove(T, de.dataset.del); await reload(); Admin.toast("ok", "삭제했습니다."); }
      catch (err) { Admin.toast("err", err.message); }
    }
  });

  try { await reload(); } catch (e) { Admin.toast("err", e.message); }
})();
</script>
</body>
</html>
