<!doctype html>
<html lang="ko" data-base="../">
<head>
<meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1">
<title>점포 관리 — 용마미식거리 관리자</title><meta name="robots" content="noindex">
<link rel="icon" href="/favicon.ico" sizes="48x48">
<link rel="icon" href="/assets/icons/favicon-32.png" type="image/png" sizes="32x32">
<link rel="apple-touch-icon" href="/assets/icons/apple-touch-icon.png">
<link rel="manifest" href="/manifest.webmanifest">
<meta name="theme-color" content="#0E1F4D">
<link rel="stylesheet" href="../assets/css/style.css?v=20261010zc">
</head>
<body class="admin-body">
<div class="admin-shell">
  <div id="admin-side"></div>
  <main class="admin-main" id="admin-main">
    <div class="admin-head">
      <div><h1>점포 관리</h1><p class="muted tiny" id="admin-who"></p></div>
      <div class="btn-row">
        <a class="btn btn--ghost btn--sm" href="../food.html" target="_blank">공개 페이지 보기</a>
        <button class="btn btn--primary btn--sm" id="btn-add">점포 등록</button>
      </div>
    </div>
    <div id="admin-msg" class="alert"></div>
    <div class="panel">
      <p class="panel-sub">
        미식 지도에 노출할 점포를 관리합니다. 상권 전체 168곳 중 상인회 회원은 124곳이며,
        K-미식벨트 어서와존 참여 점포는 10개소입니다.
      </p>
      <div class="table-scroll">
        <table class="data">
          <thead><tr><th style="min-width:100px">분류</th><th style="min-width:180px">상호</th><th>대표메뉴</th><th>연락처</th><th>어서와존</th><th>상태</th><th></th></tr></thead>
          <tbody id="rows"></tbody>
        </table>
      </div>
    </div>
  </main>
</div>
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<script src="../assets/js/config.js?v=20261006f"></script>
<script src="../assets/js/auth.js?v=20261006f"></script>
<script src="../assets/js/main.js?v=20261010"></script>
<script src="../assets/js/admin.js?v=20261010b"></script>
<script>
(async () => {
  if (!(await Admin.boot("shops.html"))) return;
  const T = "shops";
  const CAT = { korean: "한식·노포", cafe: "카페·디저트", snack: "분식·야식", etc: "그 외" };
  const F = [
    { k: "name", label: "상호", req: true },
    { k: "category", label: "분류", type: "select", options: Object.entries(CAT) },
    { k: "signature", label: "대표메뉴" },
    { k: "description", label: "소개", type: "textarea" },
    { k: "address", label: "주소" },
    { k: "phone", label: "연락처" },
    { k: "photo_url", label: "사진 주소 (선택)" },
    { k: "is_belt", label: "K-미식벨트 어서와존 참여", type: "checkbox" },
    { k: "sort_order", label: "정렬 순서", type: "number", def: 999 },
    { k: "published", label: "공개", type: "checkbox", def: true },
  ];
  let rows = [];

  const render = () => document.getElementById("rows").innerHTML = rows.map((r) => `
    <tr>
      <td><span class="chip">${CAT[r.category] || "그 외"}</span></td>
      <td><b>${Admin.esc(r.name)}</b>${r.address ? `<br><span class="tiny muted">${Admin.esc(r.address)}</span>` : ""}</td>
      <td class="tiny">${Admin.esc(r.signature || "-")}</td>
      <td class="tiny">${Admin.esc(r.phone || "-")}</td>
      <td>${r.is_belt ? '<span class="chip chip--amber">참여</span>' : "-"}</td>
      <td><span class="chip ${r.published ? "chip--green" : ""}">${r.published ? "공개" : "비공개"}</span></td>
      <td style="white-space:nowrap">
        <button class="btn btn--ghost btn--sm" data-edit="${r.id}">수정</button>
        <button class="btn btn--ghost btn--sm" data-del="${r.id}">삭제</button></td>
    </tr>`).join("") || '<tr><td colspan="7" class="center muted">등록된 점포가 없습니다.</td></tr>';

  const reload = async () => { rows = await Admin.load(T, { order: ["sort_order", true] }); render(); };

  document.getElementById("btn-add").onclick = () => Admin.modal({
    title: "점포 등록", fields: F, values: { published: true, category: "korean", sort_order: 999 },
    onSave: async (v) => { await Admin.save(T, v); await reload(); Admin.toast("ok", "등록했습니다."); },
  });

  document.getElementById("rows").addEventListener("click", async (e) => {
    const ed = e.target.closest("[data-edit]"), de = e.target.closest("[data-del]");
    if (ed) {
      const row = rows.find((r) => String(r.id) === ed.dataset.edit);
      Admin.modal({ title: "점포 수정", fields: F, values: row,
        onSave: async (v) => { await Admin.save(T, v); await reload(); Admin.toast("ok", "저장했습니다."); } });
    }
    if (de && confirm("삭제하시겠습니까?")) {
      try { await Admin.remove(T, de.dataset.del); await reload(); Admin.toast("ok", "삭제했습니다."); }
      catch (err) { Admin.toast("err", err.message); }
    }
  });

  try { await reload(); } catch (e) { Admin.toast("err", e.message); }
})();
</script>
</body>
</html>
