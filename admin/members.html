<!doctype html>
<html lang="ko" data-base="../">
<head>
<meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1">
<title>회원 관리 — 용마미식거리 관리자</title><meta name="robots" content="noindex">
<link rel="icon" href="../assets/img/mascot-yong.webp">
<link rel="stylesheet" href="../assets/css/style.css?v=20261005b">
</head>
<body class="admin-body">
<div class="admin-shell">
  <div id="admin-side"></div>
  <main class="admin-main" id="admin-main">
    <div class="admin-head">
      <div><h1>회원 관리</h1><p class="muted tiny" id="admin-who"></p></div>
      <div class="btn-row">
        <button class="btn btn--ghost btn--sm" id="btn-mkt">수신동의 명단 CSV</button>
        <button class="btn btn--ghost btn--sm" id="btn-csv">전체 CSV</button>
      </div>
    </div>
    <div id="admin-msg" class="alert"></div>

    <div class="grid grid-4">
      <div class="tile"><dt>전체 회원</dt><dd class="num" id="n-all">-</dd></div>
      <div class="tile"><dt>일반 회원</dt><dd class="num" id="n-member">-</dd></div>
      <div class="tile"><dt>스태프·관리자</dt><dd class="num" id="n-staff">-</dd></div>
      <div class="tile"><dt>소식 수신 동의</dt><dd class="num" id="n-mkt">-</dd></div>
    </div>

    <div class="panel mt-4">
      <p class="panel-sub">
        권한은 <b>회원 → 스태프 → 관리자</b> 순으로 높아집니다. 스태프 이상만 관리자 페이지에 접근할 수 있습니다.
        권한 변경은 관리자만 가능합니다.
      </p>
      <div class="field" style="max-width:340px">
        <input class="input" id="q" placeholder="이름 또는 이메일로 검색">
      </div>
      <div class="table-scroll">
        <table class="data">
          <thead><tr><th>가입일</th><th style="min-width:140px">이름</th><th style="min-width:200px">이메일</th><th>연락처</th><th>수신동의</th><th style="min-width:130px">권한</th></tr></thead>
          <tbody id="rows"></tbody>
        </table>
      </div>
    </div>
  </main>
</div>
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<script src="../assets/js/config.js"></script>
<script src="../assets/js/auth.js"></script>
<script src="../assets/js/main.js"></script>
<script src="../assets/js/admin.js"></script>
<script>
(async () => {
  if (!(await Admin.boot("members.html"))) return;
  const T = "profiles";
  const ROLE = { member: "회원", staff: "스태프", admin: "관리자" };
  const isAdmin = Admin.profile?.role === "admin";
  let rows = [], q = "";

  function render() {
    const list = q
      ? rows.filter((r) => (r.name || "").includes(q) || (r.email || "").toLowerCase().includes(q.toLowerCase()))
      : rows;
    document.getElementById("rows").innerHTML = list.map((r) => `
      <tr>
        <td class="tiny num">${UI.date(r.created_at)}</td>
        <td><b>${Admin.esc(r.name || "-")}</b></td>
        <td class="tiny">${Admin.esc(r.email || "-")}</td>
        <td class="tiny num">${Admin.esc(r.phone || "-")}</td>
        <td>${r.marketing_opt_in ? '<span class="chip chip--green">동의</span>' : "-"}</td>
        <td>${isAdmin
          ? `<select class="select" data-role="${r.id}" style="padding:6px 10px;font-size:.8125rem">
              ${Object.entries(ROLE).map(([k, v]) => `<option value="${k}"${r.role === k ? " selected" : ""}>${v}</option>`).join("")}
             </select>`
          : `<span class="chip">${ROLE[r.role] || "회원"}</span>`}</td>
      </tr>`).join("") || '<tr><td colspan="6" class="center muted">회원이 없습니다.</td></tr>';

    document.getElementById("n-all").textContent = rows.length;
    document.getElementById("n-member").textContent = rows.filter((r) => !r.role || r.role === "member").length;
    document.getElementById("n-staff").textContent = rows.filter((r) => r.role === "staff" || r.role === "admin").length;
    document.getElementById("n-mkt").textContent = rows.filter((r) => r.marketing_opt_in).length;
  }

  document.getElementById("q").addEventListener("input", (e) => { q = e.target.value.trim(); render(); });

  document.getElementById("rows").addEventListener("change", async (e) => {
    const sel = e.target.closest("[data-role]"); if (!sel) return;
    if (sel.dataset.role === Admin.user.id && sel.value !== "admin") {
      if (!confirm("본인의 관리자 권한을 내리면 이 페이지에 다시 들어올 수 없습니다. 계속하시겠습니까?")) {
        return render();
      }
    }
    try {
      await Admin.save(T, { id: sel.dataset.role, role: sel.value });
      const r = rows.find((x) => x.id === sel.dataset.role); if (r) r.role = sel.value;
      render(); Admin.toast("ok", "권한을 변경했습니다.");
    } catch (err) { Admin.toast("err", err.message); render(); }
  });

  function csv(list, name) {
    const head = ["가입일", "이름", "이메일", "연락처", "수신동의", "권한"];
    const body = list.map((r) => [UI.date(r.created_at), r.name, r.email, r.phone,
      r.marketing_opt_in ? "동의" : "", ROLE[r.role] || "회원"]);
    const text = [head, ...body].map((row) => row.map((c) => `"${String(c ?? "").replace(/"/g, '""')}"`).join(",")).join("\r\n");
    const url = URL.createObjectURL(new Blob(["﻿" + text], { type: "text/csv;charset=utf-8" }));
    const a = document.createElement("a"); a.href = url; a.download = name; a.click(); URL.revokeObjectURL(url);
  }
  document.getElementById("btn-csv").onclick = () => csv(rows, `회원명단_${new Date().toISOString().slice(0, 10)}.csv`);
  document.getElementById("btn-mkt").onclick = () => csv(rows.filter((r) => r.marketing_opt_in), `수신동의명단_${new Date().toISOString().slice(0, 10)}.csv`);

  try { rows = await Admin.load(T, { order: ["created_at", false] }); render(); }
  catch (e) { Admin.toast("err", e.message); }
})();
</script>
</body>
</html>
