<!doctype html>
<html lang="ko" data-base="">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>로그인 · 회원가입 — 용마미식거리</title>
<meta name="robots" content="noindex">
<link rel="icon" href="/favicon.ico" sizes="48x48">
<link rel="icon" href="/assets/icons/favicon-32.png" type="image/png" sizes="32x32">
<link rel="apple-touch-icon" href="/assets/icons/apple-touch-icon.png">
<link rel="manifest" href="/manifest.webmanifest">
<meta name="theme-color" content="#0E1F4D">
<link rel="stylesheet" href="assets/css/style.css?v=20261010x">
</head>
<body>
<div id="site-header"></div>

<main class="section">
  <div class="wrap">
    <div class="center" style="margin-bottom:32px">
      <img src="assets/img/mascot-hello.webp" alt="" style="width:150px;margin:0 auto 12px">
      <h1 style="font-size:clamp(1.5rem,1.2rem+1vw,2rem)">용마미식거리 회원</h1>
      <p class="muted mt-1">프리마켓·버스킹 신청과 소식 알림을 받아보실 수 있습니다.</p>
    </div>

    <div class="auth-card">
      <div class="tabs" role="tablist">
        <button id="tab-in" class="active" role="tab" aria-selected="true">로그인</button>
        <button id="tab-up" role="tab" aria-selected="false">회원가입</button>
      </div>

      <div id="msg" class="alert"></div>

      <!-- 소셜 로그인 — 가입과 로그인이 한 번에 됩니다(처음이면 자동으로 가입) -->
      <div class="social">
        <button type="button" class="btn btn--block social-btn social-google" id="btn-google">
          <svg viewBox="0 0 48 48" aria-hidden="true">
            <path fill="#4285F4" d="M45.1 24.5c0-1.6-.1-3.1-.4-4.5H24v8.5h11.8c-.5 2.7-2 5-4.3 6.6v5.5h7c4.1-3.8 6.6-9.4 6.6-16.1z"/>
            <path fill="#34A853" d="M24 46c5.8 0 10.7-1.9 14.3-5.2l-7-5.5c-1.9 1.3-4.4 2.1-7.3 2.1-5.6 0-10.4-3.8-12.1-8.9H4.7v5.6C8.3 41.400 15.6 46 24 46z"/>
            <path fill="#FBBC05" d="M11.9 28.5c-.4-1.3-.7-2.7-.7-4.5s.3-3.2.7-4.5v-5.6H4.7C3.1 17.1 2.2 20.4 2.2 24s.9 6.9 2.5 10.1l7.2-5.6z"/>
            <path fill="#EA4335" d="M24 9.5c3.2 0 6 1.1 8.2 3.2l6.2-6.2C34.7 3 29.8 1 24 1 15.6 1 8.3 5.6 4.7 13.9l7.2 5.6C13.6 13.3 18.4 9.5 24 9.5z"/>
          </svg>
          구글로 계속하기
        </button>
        <p class="social-note">
          처음이시면 누르는 즉시 회원으로 가입됩니다 ·
          이름·이메일을 받아 신청 접수와 안내에만 쓰며, 사업 종료 후 1년까지 보관합니다.
        </p>
      </div>

      <div class="or"><span>또는 이메일로</span></div>

      <!-- 로그인 -->
      <form id="form-in" novalidate>
        <div class="field">
          <label for="in-email">이메일</label>
          <input class="input" id="in-email" type="email" autocomplete="email" required placeholder="you@example.com">
        </div>
        <div class="field">
          <label for="in-pw">비밀번호</label>
          <input class="input" id="in-pw" type="password" autocomplete="current-password" required>
        </div>
        <button class="btn btn--primary btn--block" type="submit">로그인</button>
        <p class="center mt-3 tiny">
          <a href="#" id="link-reset" style="color:var(--amber-700);font-weight:600">비밀번호를 잊으셨나요?</a>
        </p>
      </form>

      <!-- 회원가입 -->
      <form id="form-up" class="hidden" novalidate>
        <div class="field">
          <label for="up-name">이름</label>
          <input class="input" id="up-name" type="text" autocomplete="name" required placeholder="홍길동">
        </div>
        <div class="field">
          <label for="up-email">이메일</label>
          <input class="input" id="up-email" type="email" autocomplete="email" required placeholder="you@example.com">
          <p class="hint">가입 확인 메일이 발송됩니다.</p>
        </div>
        <div class="field">
          <label for="up-phone">연락처 <span class="muted" style="font-weight:500">(선택)</span></label>
          <input class="input" id="up-phone" type="tel" autocomplete="tel" placeholder="010-0000-0000">
        </div>
        <div class="field">
          <label for="up-pw">비밀번호</label>
          <input class="input" id="up-pw" type="password" autocomplete="new-password" required minlength="8">
          <p class="hint">8자 이상 입력해 주십시오.</p>
        </div>
        <div class="field">
          <label class="checkbox"><input type="checkbox" id="up-agree" required>
            <span>[필수] 개인정보 수집·이용에 동의합니다. 수집 항목은 이름·이메일·연락처이며, 신청 접수와 안내 목적에 한해 사업 종료 후 1년까지 보관합니다.</span></label>
        </div>
        <div class="field">
          <label class="checkbox"><input type="checkbox" id="up-mkt">
            <span>[선택] 공연·프리마켓 등 행사 소식을 이메일로 받겠습니다.</span></label>
        </div>
        <button class="btn btn--primary btn--block" type="submit">회원가입</button>
      </form>
    </div>
  </div>
</main>

<div id="site-footer"></div>

<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<script src="assets/js/config.js?v=20261006f"></script>
<script src="assets/js/layout.js?v=20261006f"></script>
<script src="assets/js/i18n.js?v=20261006f"></script>
<script src="assets/js/auth.js?v=20261006f"></script>
<script src="assets/js/main.js?v=20261010"></script>
<script>
(() => {
  const msg = document.getElementById("msg");
  const tabIn = document.getElementById("tab-in"), tabUp = document.getElementById("tab-up");
  const formIn = document.getElementById("form-in"), formUp = document.getElementById("form-up");

  function show(which) {
    const up = which === "up";
    tabUp.classList.toggle("active", up); tabIn.classList.toggle("active", !up);
    tabUp.setAttribute("aria-selected", String(up)); tabIn.setAttribute("aria-selected", String(!up));
    formUp.classList.toggle("hidden", !up); formIn.classList.toggle("hidden", up);
    UI.clearAlert(msg);
  }
  tabIn.onclick = () => show("in");
  tabUp.onclick = () => show("up");
  if (location.hash === "#signup") show("up");

  if (!Auth.ready()) {
    UI.alert(msg, "warn", "회원 시스템이 아직 연결되지 않았습니다. Supabase 설정(assets/js/config.js)을 완료하면 바로 사용할 수 있습니다.");
  }

  /* ---------- 소셜 로그인(구글) ----------
     카카오는 Supabase 가 account_email 동의항목을 고정 요청하는데, 그 항목을 쓰려면
     카카오 비즈니스 앱 전환이 필요해 보류했다(2026-10-01). 전환이 끝나면 버튼을 되살린다. */
  const SOCIAL = { google: "구글" };

  async function social(provider, btn) {
    UI.clearAlert(msg);
    btn.disabled = true;
    try {
      // 돌아온 뒤 '가입을 막 마친 것'인지 알기 위해 표시를 남겨 둡니다
      // 꺼진 업체로 보내면 Supabase 오류 화면으로 넘어가 버리므로, 켜져 있는지 먼저 확인한다
      if (!Auth.ready()) throw new Error("NOT_CONFIGURED");
      if (!(await Auth.enabledProviders()).includes(provider)) throw new Error("PROVIDER_OFF");
      sessionStorage.setItem("oauth_from", provider);
      await Auth.signInWithProvider(provider);
      // 여기서 업체 로그인 화면으로 넘어갑니다(아래 줄은 보통 실행되지 않습니다)
    } catch (err) {
      sessionStorage.removeItem("oauth_from");
      btn.disabled = false;
      UI.alert(msg, "err",
        err.message === "NOT_CONFIGURED" ? "회원 시스템이 아직 연결되지 않았습니다."
        : err.message === "PROVIDER_OFF"
          ? `${SOCIAL[provider]} 로그인이 아직 켜지지 않았습니다. 관리자가 Supabase에서 ${SOCIAL[provider]} 연결을 마치면 바로 사용할 수 있습니다. 그동안은 아래 이메일로 로그인해 주십시오.`
        : err.message);
    }
  }
  document.getElementById("btn-google").addEventListener("click", function () { social("google", this); });

  /* 소셜 로그인으로 돌아왔을 때 — Supabase가 주소의 인증 정보를 세션으로 바꿔 둡니다.
     업체는 이름만 주고 연락처·수신동의는 주지 않으므로, 빈 칸만 채운 뒤 마이페이지로 보냅니다. */
  (async () => {
    const from = sessionStorage.getItem("oauth_from");
    const hasAuthInUrl = /[?#].*(access_token|code=|error=)/.test(location.href);
    if (!from && !hasAuthInUrl) return;

    // 업체 쪽에서 거절·취소된 경우
    const errTxt = new URLSearchParams(location.hash.replace(/^#/, "") || location.search)
      .get("error_description");
    if (errTxt) {
      sessionStorage.removeItem("oauth_from");
      history.replaceState(null, "", location.pathname);
      return UI.alert(msg, "err", decodeURIComponent(errTxt.replace(/\+/g, " ")));
    }
    if (!Auth.ready()) return;

    const u = await Auth.user();
    if (!u) return;                       // 아직 세션이 안 잡혔으면 그대로 둡니다
    sessionStorage.removeItem("oauth_from");
    history.replaceState(null, "", location.pathname);   // 주소창에서 토큰을 지웁니다
    try { await Auth.fillProfileAfterOAuth(false); } catch (e) { /* 프로필은 나중에 보완 가능 */ }
    location.replace("mypage.html");
  })();

  /* 로그인 */
  formIn.addEventListener("submit", async (e) => {
    e.preventDefault();
    UI.clearAlert(msg);
    const btn = formIn.querySelector("button[type=submit]");
    btn.disabled = true;
    try {
      await Auth.signIn({
        email: document.getElementById("in-email").value.trim(),
        password: document.getElementById("in-pw").value,
      });
      location.href = "mypage.html";
    } catch (err) {
      UI.alert(msg, "err",
        err.message === "NOT_CONFIGURED" ? "회원 시스템이 아직 연결되지 않았습니다."
        : /Invalid login/i.test(err.message) ? "이메일 또는 비밀번호가 올바르지 않습니다."
        : /Email not confirmed/i.test(err.message) ? "가입 확인 메일의 링크를 먼저 클릭해 주십시오."
        : err.message);
      btn.disabled = false;
    }
  });

  /* 회원가입 */
  formUp.addEventListener("submit", async (e) => {
    e.preventDefault();
    UI.clearAlert(msg);
    if (!document.getElementById("up-agree").checked) {
      return UI.alert(msg, "err", "개인정보 수집·이용 동의가 필요합니다.");
    }
    const pw = document.getElementById("up-pw").value;
    if (pw.length < 8) return UI.alert(msg, "err", "비밀번호는 8자 이상이어야 합니다.");

    const btn = formUp.querySelector("button[type=submit]");
    btn.disabled = true;
    try {
      const name = document.getElementById("up-name").value.trim();
      const data = await Auth.signUp({
        email: document.getElementById("up-email").value.trim(),
        password: pw,
        name,
        phone: document.getElementById("up-phone").value.trim(),
        marketing: document.getElementById("up-mkt").checked,
      });
      formUp.reset();
      if (data && data.session) {
        // 메일 인증 없이 바로 가입·로그인된 경우 — 감사 인사 후 마이페이지로 이동
        UI.alert(msg, "ok",
          `${name ? name + "님, " : ""}용마미식거리 회원이 되어 주셔서 진심으로 감사합니다! ` +
          "가입이 완료되었습니다. 이제 프리마켓·버스킹 신청과 소식 알림을 받아보실 수 있습니다. 잠시 후 마이페이지로 이동합니다.");
        setTimeout(() => { location.href = "mypage.html"; }, 3000);
        return;
      }
      UI.alert(msg, "ok", "가입 확인 메일을 보냈습니다. 메일의 링크를 클릭하면 가입이 완료됩니다.");
    } catch (err) {
      UI.alert(msg, "err",
        err.message === "NOT_CONFIGURED" ? "회원 시스템이 아직 연결되지 않았습니다."
        : /already registered/i.test(err.message) ? "이미 가입된 이메일입니다."
        : err.message);
    } finally {
      btn.disabled = false;
    }
  });

  /* 비밀번호 재설정 */
  document.getElementById("link-reset").addEventListener("click", async (e) => {
    e.preventDefault();
    const email = document.getElementById("in-email").value.trim();
    if (!email) return UI.alert(msg, "info", "이메일을 먼저 입력한 뒤 다시 눌러 주십시오.");
    try {
      await Auth.resetPassword(email);
      UI.alert(msg, "ok", "비밀번호 재설정 메일을 보냈습니다.");
    } catch (err) {
      UI.alert(msg, "err", err.message === "NOT_CONFIGURED" ? "회원 시스템이 아직 연결되지 않았습니다." : err.message);
    }
  });
})();
</script>
</body>
</html>
