<!doctype html>
<html lang="ko" data-base="">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>갤러리 — 용마미식거리</title>
<meta name="description" content="용마미식거리 현장 사진 갤러리. 2026년 9월 18일 제2회 용마미식거리 맛집대축제 개막일부터 매주 금·토요일 운영까지 날짜별로 모았습니다.">
<meta property="og:title" content="갤러리 — 용마미식거리">
<meta property="og:description" content="강릉 용마미식거리 현장 사진을 날짜별로 모았습니다.">
<meta property="og:image" content="https://2026yongma.com/assets/img/gallery/20260918_201800.webp">
<link rel="icon" href="/favicon.ico" sizes="48x48">
<link rel="icon" href="/assets/icons/favicon-32.png" type="image/png" sizes="32x32">
<link rel="apple-touch-icon" href="/assets/icons/apple-touch-icon.png">
<link rel="manifest" href="/manifest.webmanifest">
<meta name="theme-color" content="#0E1F4D">
<link rel="stylesheet" href="assets/css/style.css?v=20261010r">
</head>
<body>
<div id="site-header"></div>

<main>

<section class="page-hero" style="background-image:linear-gradient(180deg,rgba(12,10,9,.70),rgba(12,10,9,.82)),url('assets/img/gallery/20260918_201709.webp')">
  <div class="wrap">
    <span class="eyebrow">Gallery</span>
    <h1>골목의 날들</h1>
    <p class="lead mt-2" style="max-width:60ch">
      용마미식거리 현장 사진을 날짜별로 모았습니다. 최근 날짜가 위에 오고,
      하루 안에서는 찍은 시간 순서대로 이어집니다.
    </p>
    <div class="chip-row mt-3" id="gal-summary"></div>
    <div class="btn-row mt-3"><a class="btn btn--primary" href="#upload" data-up-open>📷 사진 올리기</a></div>
  </div>
</section>

<section class="section" style="padding-top:clamp(28px,4vw,48px)">
  <div class="wrap">
    <nav class="gal-filter" id="gal-filter" aria-label="날짜 선택"></nav>
    <div id="gal-days"></div>
    <noscript><p class="muted">사진 목록을 보려면 자바스크립트를 켜 주세요.</p></noscript>
  </div>
</section>

<!-- 사진 올리기 — 방문객 사진은 이 칸 아래, 수행사 사진은 위 날짜별 갤러리로 (assets/js/gallery-upload.js) -->
<section class="section section--warm" id="visitor">
  <div class="wrap">
    <div id="gal-upload"></div>
  </div>
</section>

</main>

<!-- 확대 보기 -->
<dialog class="lightbox" id="lightbox" aria-label="사진 크게 보기">
  <figure class="lightbox__fig">
    <img id="lb-img" alt="">
    <figcaption>
      <span id="lb-cap"></span>
      <span class="lightbox__meta" id="lb-meta"></span>
    </figcaption>
  </figure>
  <button class="lightbox__btn lightbox__close" id="lb-close" aria-label="닫기">×</button>
  <button class="lightbox__btn lightbox__prev" id="lb-prev" aria-label="이전 사진">‹</button>
  <button class="lightbox__btn lightbox__next" id="lb-next" aria-label="다음 사진">›</button>
</dialog>

<div id="site-footer"></div>

<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<script src="assets/js/config.js?v=20261006f"></script>
<script src="assets/js/layout.js?v=20261006f"></script>
<script src="assets/js/i18n.js?v=20261006f"></script>
<script src="assets/js/auth.js?v=20261006f"></script>
<script src="assets/js/main.js?v=20261010"></script>
<script src="assets/js/gallery-data.js?v=20261006f"></script>
<script>
/* 갤러리 — assets/js/gallery-data.js 를 날짜별로 그린다 */
(function () {
  const G = window.GALLERY || { days: {}, photos: [] };
  const IMG = "assets/img/gallery/";
  const WEEK = ["일", "월", "화", "수", "목", "금", "토"];
  const esc = (s) => String(s || "").replace(/[&<>"]/g, (c) => ({ "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;" }[c]));

  const dayLabel = (d) => {
    const [y, m, dd] = d.split("-").map(Number);
    const w = WEEK[new Date(y, m - 1, dd).getDay()];
    return { short: `${m}. ${dd}.(${w})`, long: `${y}년 ${m}월 ${dd}일 ${w}요일` };
  };
  const bucket = (t) => {
    const h = +t.slice(0, 2);
    return h < 12 ? "오전" : h < 17 ? "오후" : h < 19 ? "저녁" : "밤";
  };

  // 공식 사진 = gallery-data.js 의 기록사진 + 수행사가 홈페이지에서 올린 사진(gallery-upload.js 가 넣어 줌)
  // 수행사 사진은 { src, thumb, canDelete, dbId } 를 함께 가지고 옵니다.
  let staff = [];
  let order = [];
  let official = [];
  let picked = "all";                              // 지금 고른 날짜 버튼

  const filter = document.getElementById("gal-filter");
  const box = document.getElementById("gal-days");

  function render() {
    // 날짜별 묶기 — 최근 날짜 먼저, 하루 안에서는 시간 순
    const all = G.photos.concat(staff);
    const byDay = {};
    all.forEach((p) => (byDay[p.date] = byDay[p.date] || []).push(p));
    Object.values(byDay).forEach((l) => l.sort((a, b) => (a.time || "").localeCompare(b.time || "")));
    const dates = Object.keys(byDay).sort().reverse();
    order = dates.flatMap((d) => byDay[d]);         // 확대 보기에서 넘기는 순서
    official = order.map((p) => ({
      url: p.src || IMG + p.id + ".webp",
      caption: p.caption || "현장 사진",
      meta: `${dayLabel(p.date).long} ${p.time || ""}`.trim(),
    }));
    if (picked !== "all" && !byDay[picked]) picked = "all";

    document.getElementById("gal-summary").innerHTML =
      `<span class="chip chip--amber">사진 ${all.length}장</span><span class="chip">${dates.length}일의 기록</span>`;

    filter.innerHTML = `<button class="${picked === "all" ? "active" : ""}" data-d="all">전체</button>` +
      dates.map((d) => `<button class="${picked === d ? "active" : ""}" data-d="${d}">${dayLabel(d).short}</button>`).join("");

    box.innerHTML = dates.map((d) => {
      const info = G.days[d] || {};
      const lab = dayLabel(d);
      let last = "";
      const items = byDay[d].map((p) => {
        const b = bucket(p.time || "12:00");
        const head = b !== last ? `<p class="gal-bucket">${b}</p>` : "";
        last = b;
        const i = order.indexOf(p);
        const btn = `<button class="gal-item" data-i="${i}" aria-label="${esc(p.caption || "현장 사진")} 크게 보기">
            <img src="${p.thumb || IMG + p.id + "_t.webp"}" alt="${esc(p.caption)}" loading="lazy" width="${p.w || 480}" height="${p.h || 360}">
            <span class="gal-item__cap"><b>${esc(p.time || "")}</b>${esc(p.caption)}</span>
          </button>`;
        // 수행사가 올린 사진은 직원 계정일 때 지우기 버튼을 붙입니다
        return head + (p.canDelete
          ? `<div class="gal-cell">${btn}<button class="gal-del" data-staff-del="${p.dbId}" type="button" title="수행사 사진 지우기">지우기</button></div>`
          : btn);
      }).join("");
      return `<section class="gal-day" id="d-${d}" data-d="${d}"${picked !== "all" && picked !== d ? " hidden" : ""}>
        <header class="gal-day__head">
          <div class="gal-day__date"><b>${lab.short}</b><span>${lab.long}</span></div>
          <div>
            <h2>${esc(info.title) || lab.long}</h2>
            ${info.note ? `<p class="muted mt-1">${esc(info.note)}</p>` : ""}
          </div>
          <span class="chip">${byDay[d].length}장</span>
        </header>
        <div class="gal-grid">${items}</div>
      </section>`;
    }).join("") || `<p class="muted">등록된 사진이 없습니다.</p>`;
  }
  render();

  /* 수행사 사진 넣기 — gallery-upload.js 가 목록을 불러온 뒤 부릅니다 */
  window.GallerySetStaff = (list) => { staff = list || []; render(); };

  filter.addEventListener("click", (e) => {
    const btn = e.target.closest("button");
    if (!btn) return;
    picked = btn.dataset.d;
    filter.querySelectorAll("button").forEach((b) => b.classList.toggle("active", b === btn));
    box.querySelectorAll(".gal-day").forEach((s) => {
      s.hidden = picked !== "all" && s.dataset.d !== picked;
    });
    // 사진 올리기 칸의 날짜도 같이 맞춰 줍니다
    document.dispatchEvent(new CustomEvent("gal:day", { detail: picked }));
  });

  // ---- 확대 보기 ----
  // 공식 기록사진과 방문객 사진이 같은 창을 씁니다. 보여 줄 목록(items)만 갈아 끼웁니다.
  const lb = document.getElementById("lightbox");
  const img = document.getElementById("lb-img");
  let items = official;
  let cur = 0;
  const show = (i) => {
    if (!items.length) return;
    cur = (i + items.length) % items.length;
    const p = items[cur];
    img.src = p.url;
    img.alt = p.caption;
    document.getElementById("lb-cap").textContent = p.caption;
    document.getElementById("lb-meta").textContent = `${p.meta} · ${cur + 1} / ${items.length}`;
  };
  /* 방문객 사진 쪽(gallery-upload.js)에서 이 창을 열 때 씁니다 */
  window.GalleryLightbox = (list, i) => {
    items = list;
    show(i);
    lb.showModal();
  };
  box.addEventListener("click", (e) => {
    const del = e.target.closest("[data-staff-del]");
    if (del) {
      if (window.GalleryDeleteStaff) window.GalleryDeleteStaff(+del.dataset.staffDel, del);
      return;
    }
    const it = e.target.closest(".gal-item");
    if (!it) return;
    items = official;
    show(+it.dataset.i);
    lb.showModal();
  });
  document.getElementById("lb-close").onclick = () => lb.close();
  document.getElementById("lb-prev").onclick = () => show(cur - 1);
  document.getElementById("lb-next").onclick = () => show(cur + 1);
  lb.addEventListener("click", (e) => { if (e.target === lb) lb.close(); });
  lb.addEventListener("keydown", (e) => {
    if (e.key === "ArrowLeft") show(cur - 1);
    if (e.key === "ArrowRight") show(cur + 1);
  });
  let x0 = null;   // 휴대폰 좌우 밀기
  lb.addEventListener("touchstart", (e) => (x0 = e.touches[0].clientX), { passive: true });
  lb.addEventListener("touchend", (e) => {
    if (x0 === null) return;
    const dx = e.changedTouches[0].clientX - x0;
    if (Math.abs(dx) > 50) show(cur + (dx < 0 ? 1 : -1));
    x0 = null;
  });

  // 주소에 #d-2026-09-18 처럼 날짜가 붙어 오면 그 날짜만 보여 준다
  const fromHash = () => {
    const pre = filter.querySelector(`button[data-d="${location.hash.replace("#d-", "")}"]`);
    if (pre) pre.click();
  };
  fromHash();
  window.addEventListener("hashchange", fromHash);
})();
</script>
<script src="assets/js/gallery-upload.js?v=20261010"></script>
</body>
</html>
